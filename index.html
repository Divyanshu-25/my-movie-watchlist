<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Movie Watchlist</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      background-color: #1e1e1e;
      color: #fff;
      padding: 2rem;
      max-width: 700px;
      margin: auto;
    }

    h1 {
      text-align: center;
      margin-bottom: 2rem;
    }

    form {
      display: flex;
      gap: 1rem;
      margin-bottom: 2rem;
      flex-wrap: wrap;
    }

    .search-container {
      position: relative;
      flex: 1 1 300px;
    }

    input,
    select,
    button {
      padding: 10px;
      font-size: 1rem;
      border: none;
      border-radius: 4px;
      box-sizing: border-box;
    }

    input,
    select {
      width: 100%;
    }

    button {
      background-color: #28a745;
      color: white;
      cursor: pointer;
    }

    button:hover {
      background-color: #218838;
    }

    #suggestions {
      position: absolute;
      top: calc(100% + 4px);
      left: 0;
      right: 0;
      background-color: #333;
      border-radius: 6px;
      overflow: hidden;
      z-index: 1000;
      box-shadow: 0 6px 15px rgba(0, 0, 0, 0.4);
    }

    .suggestion {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 8px 10px;
      cursor: pointer;
      border-bottom: 1px solid #444;
    }

    .suggestion:last-child {
      border-bottom: none;
    }

    .suggestion:hover {
      background-color: #444;
    }

    .suggestion-poster {
      width: 42px;
      height: 58px;
      object-fit: cover;
      border-radius: 4px;
      background-color: #222;
      flex-shrink: 0;
    }

    .suggestion-info {
      min-width: 0;
    }

    .suggestion-title {
      font-weight: bold;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .suggestion-meta {
      color: #bbb;
      font-size: 0.85rem;
      margin-top: 4px;
    }

    .no-results {
      padding: 12px;
      color: #bbb;
      text-align: center;
    }

    .loading {
      padding: 12px;
      color: #bbb;
      text-align: center;
    }

    .movie-list {
      list-style: none;
      padding: 0;
    }

    .movie-item {
      background-color: #333;
      padding: 1rem;
      border-radius: 8px;
      margin-bottom: 1rem;
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 1rem;
    }

    .movie-info {
      flex-grow: 1;
    }

    .movie-actions {
      flex-shrink: 0;
    }

    .movie-actions button {
      margin-left: 0.5rem;
      padding: 5px 10px;
      font-size: 0.9rem;
      background-color: #6c757d;
    }

    .movie-actions button:hover {
      background-color: #5a6268;
    }

    .watched {
      text-decoration: line-through;
      opacity: 0.6;
    }

    @media (max-width: 600px) {
      body {
        padding: 1rem;
      }

      .movie-item {
        flex-direction: column;
      }

      .movie-actions {
        width: 100%;
        text-align: right;
      }
    }
  </style>
</head>

<body>
  <h1>🎬 My Movie Watchlist</h1>

  <form id="movie-form">
    <div class="search-container">
      <input
        type="text"
        id="title"
        placeholder="Search movies, series..."
        autocomplete="off"
        required
      />
      <div id="suggestions"></div>
    </div>

    <select id="status">
      <option value="to-watch">To Watch</option>
      <option value="watched">Watched</option>
    </select>

    <button type="submit">Add Movie</button>
  </form>

  <ul id="movie-list" class="movie-list"></ul>

  <script>
    const movieForm = document.getElementById('movie-form');
    const movieList = document.getElementById('movie-list');
    const titleInput = document.getElementById('title');
    const suggestionsDiv = document.getElementById('suggestions');
    const statusInput = document.getElementById('status');

    let movies = JSON.parse(localStorage.getItem('movies')) || [];

    const API_KEY = '3edfe428';

    let searchTimeout;
    let searchRequestId = 0;

    async function fetchMovieData(title, imdbID = null) {
      let url;

      if (imdbID) {
        url = `https://www.omdbapi.com/?apikey=${API_KEY}&i=${encodeURIComponent(imdbID)}&plot=full`;
      } else {
        url = `https://www.omdbapi.com/?apikey=${API_KEY}&t=${encodeURIComponent(title)}&plot=full`;
      }

      try {
        const res = await fetch(url);
        const data = await res.json();

        if (data.Response === "True") {
          return {
            imdbID: data.imdbID,
            title: data.Title,
            year: data.Year,
            poster: data.Poster !== "N/A" ? data.Poster : null,
            plot: data.Plot !== "N/A" ? data.Plot : "No description available.",
            type: data.Type || "movie"
          };
        } else {
          alert("Movie/series not found.");
          return null;
        }
      } catch (err) {
        console.error(err);
        alert("Error fetching movie data.");
        return null;
      }
    }

    function saveToLocalStorage() {
      localStorage.setItem('movies', JSON.stringify(movies));
    }

    titleInput.addEventListener('input', function () {
      clearTimeout(searchTimeout);

      const query = titleInput.value.trim();

      if (query.length === 0) {
        suggestionsDiv.innerHTML = '';
        return;
      }

      searchTimeout = setTimeout(() => {
        fetchSuggestions(query);
      }, 250);
    });

    async function fetchSuggestions(query) {
      const requestId = ++searchRequestId;

      suggestionsDiv.innerHTML = '<div class="loading">Searching...</div>';

      try {
        const url = `https://www.omdbapi.com/?apikey=${API_KEY}&s=${encodeURIComponent(query)}`;

        const res = await fetch(url);
        const data = await res.json();

        if (requestId !== searchRequestId) return;

        suggestionsDiv.innerHTML = '';

        if (data.Response !== "True") {
          suggestionsDiv.innerHTML = '<div class="no-results">No movies or series found</div>';
          return;
        }

        data.Search.slice(0, 10).forEach(item => {
          const suggestion = document.createElement('div');
          suggestion.className = 'suggestion';

          const poster = document.createElement('img');
          poster.className = 'suggestion-poster';
          poster.src = item.Poster !== "N/A"
            ? item.Poster
            : '';
          poster.alt = item.Title;

          const info = document.createElement('div');
          info.className = 'suggestion-info';

          const title = document.createElement('div');
          title.className = 'suggestion-title';
          title.textContent = item.Title;

          const meta = document.createElement('div');
          meta.className = 'suggestion-meta';
          meta.textContent =
            `${item.Year} • ${item.Type === 'series' ? 'Series' : 'Movie'}`;

          info.appendChild(title);
          info.appendChild(meta);

          suggestion.appendChild(poster);
          suggestion.appendChild(info);

          suggestion.addEventListener('click', async function () {
            suggestionsDiv.innerHTML = '<div class="loading">Adding...</div>';

            const movieData = await fetchMovieData(item.Title, item.imdbID);

            if (movieData) {
              addMovie(movieData);
            }

            titleInput.value = '';
            suggestionsDiv.innerHTML = '';
          });

          suggestionsDiv.appendChild(suggestion);
        });

      } catch (err) {
        console.error(err);

        if (requestId === searchRequestId) {
          suggestionsDiv.innerHTML =
            '<div class="no-results">Error searching. Try again.</div>';
        }
      }
    }

    function addMovie(movieData) {
      const alreadyExists = movies.some(movie =>
        movie.imdbID && movie.imdbID === movieData.imdbID
      );

      if (alreadyExists) {
        alert("This movie/series is already in your watchlist.");
        return;
      }

      movies.push({
        ...movieData,
        status: statusInput.value
      });

      saveToLocalStorage();
      renderMovies();
    }

    function renderMovies() {
      movieList.innerHTML = '';

      movies.forEach((movie, index) => {
        const li = document.createElement('li');
        li.className = 'movie-item';

        const info = document.createElement('div');
        info.className = 'movie-info';

        const wrapper = document.createElement('div');
        wrapper.style.cssText = 'display:flex; gap:1rem;';

        if (movie.poster) {
          const poster = document.createElement('img');
          poster.src = movie.poster;
          poster.alt = movie.title;
          poster.style.cssText =
            'width:100px;height:auto;max-height:150px;object-fit:cover;border-radius:6px;';
          wrapper.appendChild(poster);
        }

        const textContainer = document.createElement('div');

        const heading = document.createElement('h3');
        heading.style.margin = '0';
        heading.textContent =
          `${movie.title} (${movie.year})`;

        const type = document.createElement('small');
        type.style.cssText =
          'display:block;color:#aaa;margin-top:4px;';
        type.textContent =
          movie.type === 'series' ? 'Series' : 'Movie';

        const badge = document.createElement('span');
        badge.style.cssText = `
          display:inline-block;
          background-color:${movie.status === 'watched' ? '#17a2b8' : '#ffc107'};
          color:#000;
          padding:4px 8px;
          border-radius:4px;
          font-size:0.8rem;
          margin:0.3rem 0;
        `;
        badge.textContent =
          movie.status === 'watched' ? 'Watched' : 'To Watch';

        const plot = document.createElement('p');
        plot.style.cssText =
          'margin:0.5rem 0 0;font-size:0.9rem;';
        plot.textContent = movie.plot;

        textContainer.appendChild(heading);
        textContainer.appendChild(type);
        textContainer.appendChild(badge);
        textContainer.appendChild(plot);

        wrapper.appendChild(textContainer);
        info.appendChild(wrapper);

        const actions = document.createElement('div');
        actions.className = 'movie-actions';

        const toggleBtn = document.createElement('button');
        toggleBtn.textContent =
          movie.status === 'watched'
            ? 'Mark as To-Watch'
            : 'Mark as Watched';

        toggleBtn.onclick = () => toggleStatus(index);

        const deleteBtn = document.createElement('button');
        deleteBtn.textContent = 'Delete';
        deleteBtn.onclick = () => deleteMovie(index);

        actions.appendChild(toggleBtn);
        actions.appendChild(deleteBtn);

        li.appendChild(info);
        li.appendChild(actions);

        movieList.appendChild(li);
      });
    }

    function toggleStatus(index) {
      movies[index].status =
        movies[index].status === 'watched'
          ? 'to-watch'
          : 'watched';

      saveToLocalStorage();
      renderMovies();
    }

    function deleteMovie(index) {
      movies.splice(index, 1);
      saveToLocalStorage();
      renderMovies();
    }

    movieForm.addEventListener('submit', async function (e) {
      e.preventDefault();

      const title = titleInput.value.trim();

      if (!title) return;

      const movieData = await fetchMovieData(title);

      if (movieData) {
        addMovie(movieData);
        titleInput.value = '';
        suggestionsDiv.innerHTML = '';
      }
    });

    document.addEventListener('click', function (e) {
      if (!e.target.closest('.search-container')) {
        suggestionsDiv.innerHTML = '';
      }
    });

    renderMovies();
  </script>
</body>

</html>
